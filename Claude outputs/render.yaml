# ===================================================
# NileSky Platform — Render Blueprint
# ===================================================
# Deploys the NestJS backend API. The two Flutter Web
# front-ends are deployed as Static Sites (see DEPLOY_NOW.md);
# they are intentionally NOT in this blueprint because Render's
# build image has no Flutter SDK.

services:
  # ─── NileSky NestJS Backend API ───
  - type: web
    name: nilesky-api          # -> https://nilesky-api.onrender.com
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /          # AppController GET / — no DB, no auth
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false             # paste your Neon connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
